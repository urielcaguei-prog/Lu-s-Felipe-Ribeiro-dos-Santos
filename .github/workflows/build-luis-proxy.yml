name: Build Netflix X Proxy Android (Real SOCKS5 VPN)
on:
  push:
    branches:
      - build/luis-proxy-socks5-20261107
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get MIT licensed SOCKS5 VPN engine
        run: git clone --recursive --depth 1 --shallow-submodules https://github.com/heiher/sockstun.git socks-vpn
      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;29.0.14206865' 'platform-tools'
      - name: Apply branded UI, access key and startup checks
        run: |
          python3 ProxyFF/patch.py socks-vpn
          cp ProxyFF/GateActivity.java socks-vpn/app/src/main/java/hev/sockstun/GateActivity.java
          cp ProxyFF/FloatingProxyService.java socks-vpn/app/src/main/java/hev/sockstun/FloatingProxyService.java
          cp ProxyFF/skull_neon.xml socks-vpn/app/src/main/res/drawable/skull_neon.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build native tun2socks APK
        working-directory: socks-vpn
        run: gradle :app:assembleDebug --stacktrace
      - name: Inspect output APK and bundled tunnel library
        run: |
          APK="$(find socks-vpn/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhev-socks5-tunnel.so'
          cp "$APK" Netflix_X_Proxy_SOCKS5.apk
          ls -lh Netflix_X_Proxy_SOCKS5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Netflix-X-Proxy-SOCKS5-APK
          path: Netflix_X_Proxy_SOCKS5.apk
          retention-days: 30
