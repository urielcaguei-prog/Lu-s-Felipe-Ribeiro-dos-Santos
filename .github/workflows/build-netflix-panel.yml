name: Build Netflix Floating Panel APK
on:
  push:
    branches:
      - build/netflix-floating-panel-20261107
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetflixFloatingPanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Netflix-Painel-Android-APK
          path: NetflixFloatingPanel/app/build/outputs/apk/debug/app-debug.apk