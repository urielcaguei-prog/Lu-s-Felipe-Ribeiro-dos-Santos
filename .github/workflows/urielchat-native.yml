name: Build Uriel Chat Android APK
on:
  push:
    branches: [urielchat-apk-build]
    paths: ['urielchat-native/**', '.github/workflows/urielchat-native.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: cd urielchat-native && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UrielChat-APK
          path: urielchat-native/app/build/outputs/apk/debug/app-debug.apk
